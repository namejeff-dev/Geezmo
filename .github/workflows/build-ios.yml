name: Build Geezmo IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -project Geezmo.xcodeproj -list

      - name: Create placeholder GoogleService plist
        run: |
          cat > Geezmo/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>API_KEY</key>
              <string>placeholder</string>
              <key>GCM_SENDER_ID</key>
              <string>000000000000</string>
              <key>PLIST_VERSION</key>
              <string>1</string>
              <key>BUNDLE_ID</key>
              <string>com.placeholder.Geezmo</string>
              <key>PROJECT_ID</key>
              <string>placeholder</string>
              <key>STORAGE_BUCKET</key>
              <string>placeholder.appspot.com</string>
              <key>IS_ADS_ENABLED</key>
              <false/>
              <key>IS_ANALYTICS_ENABLED</key>
              <false/>
              <key>IS_APPINVITE_ENABLED</key>
              <false/>
              <key>IS_GCM_ENABLED</key>
              <false/>
              <key>IS_SIGNIN_ENABLED</key>
              <false/>
              <key>GOOGLE_APP_ID</key>
              <string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          EOF

      - name: Remove Watch app dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Geezmo.xcodeproj/project.pbxproj")
          s = p.read_text()

          s = s.replace(
              '\t\t\t\tCA667A872C4918F2007E8F87 /* Embed Watch Content */,\n',
              ''
          )

          s = s.replace(
              '\t\t\t\tCA667A772C4918F1007E8F87 /* PBXTargetDependency */,\n',
              ''
          )

          p.write_text(s)
          PY

      - name: Create Geezmo app icon
        run: |
          mkdir -p Geezmo/Assets.xcassets/AppIcon.appiconset

          cat > /tmp/make_icon.swift <<'SWIFT'
          import AppKit

          let size = NSSize(width: 1024, height: 1024)
          let image = NSImage(size: size)

          image.lockFocus()

          // Pink / magenta background
          let background = NSColor(
              calibratedRed: 0.96,
              green: 0.03,
              blue: 0.40,
              alpha: 1.0
          )

          background.setFill()
          NSBezierPath(
              rect: NSRect(
                  x: 0,
                  y: 0,
                  width: 1024,
                  height: 1024
              )
          ).fill()

          // Remote body
          let remoteRect = NSRect(
              x: 312,
              y: 160,
              width: 400,
              height: 704
          )

          let remote = NSBezierPath(
              roundedRect: remoteRect,
              xRadius: 100,
              yRadius: 100
          )

          NSColor.white.setFill()
          remote.fill()

          // Main navigation ring
          let ringOuter = NSBezierPath(
              ovalIn: NSRect(
                  x: 382,
                  y: 450,
                  width: 260,
                  height: 260
              )
          )

          background.setFill()
          ringOuter.fill()

          let ringInner = NSBezierPath(
              ovalIn: NSRect(
                  x: 442,
                  y: 510,
                  width: 140,
                  height: 140
              )
          )

          NSColor.white.setFill()
          ringInner.fill()

          // Small remote buttons
          for x in [382.0, 482.0, 582.0] {
              let button = NSBezierPath(
                  ovalIn: NSRect(
                      x: x,
                      y: 330,
                      width: 60,
                      height: 60
                  )
              )

              background.setFill()
              button.fill()
          }

          // Power symbol circle
          let powerCircle = NSBezierPath(
              ovalIn: NSRect(
                  x: 462,
                  y: 735,
                  width: 100,
                  height: 100
              )
          )

          background.setFill()
          powerCircle.fill()

          image.unlockFocus()

          guard
              let tiff = image.tiffRepresentation,
              let bitmap = NSBitmapImageRep(data: tiff),
              let png = bitmap.representation(
                  using: .png,
                  properties: [:]
              )
          else {
              fatalError("Unable to generate icon")
          }

          try png.write(
              to: URL(
                  fileURLWithPath:
                  "Geezmo/Assets.xcassets/AppIcon.appiconset/AppIcon.png"
              )
          )
          SWIFT

          swift /tmp/make_icon.swift

          cat > Geezmo/Assets.xcassets/AppIcon.appiconset/Contents.json <<'EOF'
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          EOF

      - name: Disable Firebase at launch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Geezmo/GeezmoApp.swift")
          s = p.read_text()

          s = s.replace("import FirebaseCore\n", "")
          s = s.replace("import FirebaseAnalytics\n", "")

          s = s.replace(
              "        FirebaseConfiguration.shared.setLoggerLevel(.min)\n"
              "        FirebaseApp.configure()\n"
              "        Analytics.setAnalyticsCollectionEnabled(true)\n",
              ""
          )

          p.write_text(s)
          PY

      - name: Build Geezmo
        run: |
          xcodebuild \
            -project Geezmo.xcodeproj \
            -scheme Geezmo \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Geezmo.app Payload/
          zip -r Geezmo-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Geezmo-unsigned-ipa
          path: Geezmo-unsigned.ipa
