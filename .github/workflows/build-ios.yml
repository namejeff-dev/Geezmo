name: Build Geezmo IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Show Xcode version
        run: xcodebuild -version

      - name: List schemes
        run: xcodebuild -project Geezmo.xcodeproj -list

      - name: Create placeholder GoogleService plist
        run: |
          cat > Geezmo/GoogleService-Info.plist <<'EOF'
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>API_KEY</key>
              <string>placeholder</string>
              <key>GCM_SENDER_ID</key>
              <string>000000000000</string>
              <key>PLIST_VERSION</key>
              <string>1</string>
              <key>BUNDLE_ID</key>
              <string>com.placeholder.Geezmo</string>
              <key>PROJECT_ID</key>
              <string>placeholder</string>
              <key>STORAGE_BUCKET</key>
              <string>placeholder.appspot.com</string>
              <key>IS_ADS_ENABLED</key>
              <false/>
              <key>IS_ANALYTICS_ENABLED</key>
              <false/>
              <key>IS_APPINVITE_ENABLED</key>
              <false/>
              <key>IS_GCM_ENABLED</key>
              <false/>
              <key>IS_SIGNIN_ENABLED</key>
              <false/>
              <key>GOOGLE_APP_ID</key>
              <string>1:000000000000:ios:0000000000000000</string>
          </dict>
          </plist>
          EOF

      - name: Remove Watch app dependency
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Geezmo.xcodeproj/project.pbxproj")
          s = p.read_text()

          s = s.replace(
              '\t\t\t\tCA667A872C4918F2007E8F87 /* Embed Watch Content */,\n',
              ''
          )

          s = s.replace(
              '\t\t\t\tCA667A772C4918F1007E8F87 /* PBXTargetDependency */,\n',
              ''
          )

          p.write_text(s)
          PY

      - name: Create placeholder app icon
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import struct, zlib

          icon_dir = Path("Geezmo/Assets.xcassets/AppIcon.appiconset")
          icon_dir.mkdir(parents=True, exist_ok=True)

          # Create a simple opaque 1024x1024 PNG using only Python stdlib.
          w = h = 1024
          row = b"\x00" + (b"\x20\x20\x20\xff" * w)
          raw = row * h

          def chunk(kind, data):
              return (
                  struct.pack(">I", len(data))
                  + kind
                  + data
                  + struct.pack(">I", zlib.crc32(kind + data) & 0xffffffff)
              )

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(b"IHDR", struct.pack(">IIBBBBB", w, h, 8, 6, 0, 0, 0))
              + chunk(b"IDAT", zlib.compress(raw, 9))
              + chunk(b"IEND", b"")
          )

          (icon_dir / "AppIcon.png").write_bytes(png)

          (icon_dir / "Contents.json").write_text(r'''
          {
            "images" : [
              {
                "filename" : "AppIcon.png",
                "idiom" : "universal",
                "platform" : "ios",
                "size" : "1024x1024"
              }
            ],
            "info" : {
              "author" : "xcode",
              "version" : 1
            }
          }
          ''')
          PY

      - name: Disable Firebase at launch
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path("Geezmo/GeezmoApp.swift")
          s = p.read_text()

          s = s.replace("import FirebaseCore\n", "")
          s = s.replace("import FirebaseAnalytics\n", "")

          s = s.replace(
              "        FirebaseConfiguration.shared.setLoggerLevel(.min)\n"
              "        FirebaseApp.configure()\n"
              "        Analytics.setAnalyticsCollectionEnabled(true)\n",
              ""
          )

          p.write_text(s)
          PY

      - name: Build Geezmo
        run: |
          xcodebuild \
            -project Geezmo.xcodeproj \
            -scheme Geezmo \
            -configuration Release \
            -sdk iphoneos \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            -derivedDataPath build

      - name: Create IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Geezmo.app Payload/
          zip -r Geezmo-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Geezmo-unsigned-ipa
          path: Geezmo-unsigned.ipa
